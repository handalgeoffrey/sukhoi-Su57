<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="fbTitle fbDesc">
  <title id="fbTitle">Static Su-57 blueprint fallback</title>
  <desc id="fbDesc">A stylised top-down technical plan view of the Su-57, shown when the interactive 3D renderer is unavailable.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A2D2A" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFB000" stop-opacity="0.09"/>
      <stop offset="55%" stop-color="#FFB000" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#0A0B0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0B0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0B0A" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0A0B0A"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g fill="none" stroke="#2A2D2A" stroke-width="1" opacity="0.65">
    <circle cx="800" cy="450" r="320"/>
    <circle cx="800" cy="450" r="220"/>
    <circle cx="800" cy="450" r="120"/>
    <path d="M800 90v720M440 450h720"/>
    <path d="M100 100h80M100 100v80M1500 100h-80M1500 100v80M100 800h80M100 800v-80M1500 800h-80M1500 800v-80"/>
  </g>

  <g fill="none" stroke="#FFB000" stroke-width="1" opacity="0.55">
    <path d="M800 142v46M754 450h-46M800 712v46M846 450h46"/>
  </g>

  <g transform="translate(224 100) scale(1.6)" fill="none" stroke="#3D423D" stroke-width="1.25" stroke-linejoin="round">
    <path d="M360 32 C367 66 373 106 379 148 L386 190 L384 268 L392 320 L380 376 L360 398 L340 376 L328 320 L336 268 L334 190 L341 148 C347 106 353 66 360 32 Z"/>
    <path d="M337 148 L260 170 L144 206 L91 228 L103 246 L214 245 L319 231 L339 247 L344 300 L323 314 L307 266 L336 204 Z"/>
    <path d="M383 148 L460 170 L576 206 L629 228 L617 246 L506 245 L401 231 L381 247 L376 300 L397 314 L413 266 L384 204 Z"/>
    <path d="M337 330 L258 344 L212 360 L220 374 L334 361"/>
    <path d="M383 330 L462 344 L508 360 L500 374 L386 361"/>
    <path d="M326 312 L307 344 L314 363 L336 344"/>
    <path d="M394 312 L413 344 L406 363 L384 344"/>
    <path d="M352 80 C357 101 361 119 361 139 L359 151 L361 151 L361 139 C361 119 365 101 370 80"/>
    <path d="M346 222 L374 222" stroke="#FFB000" stroke-width="0.8"/>
    <path d="M344 244 L376 244" stroke="#FFB000" stroke-width="0.8"/>
    <circle cx="338" cy="360" r="8" stroke="#FFB000" stroke-width="0.8"/>
    <circle cx="382" cy="360" r="8" stroke="#FFB000" stroke-width="0.8"/>
  </g>

  <g fill="#8A8F8A" font-family="'JetBrains Mono Variable', monospace" font-size="11" letter-spacing="2">
    <text x="100" y="150">STATIC PLAN VIEW</text>
    <text x="100" y="174" fill="#5E635E">SU-57 / FELON</text>
    <text x="100" y="198" fill="#5E635E">3D LINK OFFLINE</text>
    <text x="100" y="748">PUBLIC DATA / APPROXIMATE</text>
    <text x="100" y="772" fill="#5E635E">NOT AN ENGINEERING DRAWING</text>
    <text x="1500" y="150" text-anchor="end" fill="#FFB000">ASSET // SU-57</text>
    <text x="1500" y="174" text-anchor="end" fill="#5E635E">LENGTH 20.1 M</text>
    <text x="1500" y="198" text-anchor="end" fill="#5E635E">SPAN 14.1 M</text>
    <text x="1500" y="748" text-anchor="end">RENDER SUBSYSTEM</text>
    <text x="1500" y="772" text-anchor="end" fill="#5E635E">UNAVAILABLE</text>
  </g>

  <g fill="#5E635E" font-family="'JetBrains Mono Variable', monospace" font-size="9" letter-spacing="1.5">
    <text x="800" y="122" text-anchor="middle">NOSE / -Z</text>
    <text x="800" y="780" text-anchor="middle">EXHAUST / +Z</text>
    <text x="430" y="457" text-anchor="end">PORT</text>
    <text x="1170" y="457">STARBOARD</text>
  </g>

  <path d="M0 790h1600v110H0z" fill="url(#fade)"/>
  <text x="800" y="852" text-anchor="middle" fill="#5E635E" font-family="'JetBrains Mono Variable', monospace" font-size="10" letter-spacing="3">UNOFFICIAL FAN PROJECT // STATIC DOSSIER</text>
</svg>
